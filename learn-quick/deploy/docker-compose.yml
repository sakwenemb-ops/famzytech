# Production: database + web app + background jobs + Caddy (automatic HTTPS).
# Start from this folder:  docker compose up -d --build
x-app: &app
  build:
    context: ..
    args:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
  image: learn-quick:latest
  env_file: .env
  environment:
    DATABASE_URL: postgresql://learnquick:${POSTGRES_PASSWORD}@db:5432/learnquick
    STORAGE_DIR: /data/storage
    AUTH_TRUST_HOST: "true"
  volumes:
    - uploads:/data/storage
  restart: unless-stopped

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: learnquick
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: learnquick
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnquick -d learnquick"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  app:
    <<: *app
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 60s
      retries: 3

  jobs:
    <<: *app
    command: ["sh", "deploy/run-jobs.sh"]
    depends_on:
      app: { condition: service_healthy }

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
