services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lb
      POSTGRES_PASSWORD: lb
      POSTGRES_DB: linguabridge
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis: # used from Phase 4 (job queue)
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
